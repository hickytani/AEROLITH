[project]
name = "aeropkmech"
version = "0.2.0"
description = "Revision-aware engineering design demonstrator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cadquery>=2.5,<3",
  "fastapi>=0.115,<1",
  "pint>=0.24,<1",
  "pydantic>=2.9,<3",
  "reportlab>=4.2,<5",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = ["services/api"]
addopts = "--basetemp=.pytest-tmp"

[tool.hatch.build.targets.wheel]
packages = ["services/api/aeropkmech"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
